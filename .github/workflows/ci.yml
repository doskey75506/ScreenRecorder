name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install FFmpeg
        run: |
          if ! brew list --versions ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- ScreenRecorder.xcodeproj

      - name: Run core and media tests without skips
        run: ./scripts/ci.sh

      - name: Build universal Release app
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build/ci-build.log

      - name: Verify and package app
        run: |
          app=build/DerivedData/Build/Products/Release/ScreenRecorder.app
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/ScreenRecorder" -verify_arch x86_64 arm64
          plutil -lint "$app/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/ScreenRecorder-universal.zip

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.runner }}
          path: |
            build/test-results.xml
            build/ci-tests.log
            build/ci-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScreenRecorder-${{ matrix.runner }}
          path: build/ScreenRecorder-universal.zip
          if-no-files-found: error
          retention-days: 14
